# OBLIGE 로컬 풀스택 (web + api + db)
# 실행:  docker compose up -d --build
#   web   → http://localhost:3000
#   api   → http://localhost:8000/docs
#   db    → localhost:5432 (최초 기동 시 schema.sql → seed.sql 자동 적용)
#   adminer → http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    container_name: oblige-db
    environment:
      POSTGRES_USER: oblige
      POSTGRES_PASSWORD: oblige_dev
      POSTGRES_DB: oblige
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oblige -d oblige"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    container_name: oblige-api
    environment:
      DATABASE_URL: postgresql+psycopg://oblige:oblige_dev@db:5432/oblige
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-secure-32byte-random-string}
      CORS_ORIGINS: '["http://localhost:3000"]'
      # AI 추론/에이전트 (선택): MODEL_PATH, ANTHROPIC_API_KEY
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    container_name: oblige-web
    environment:
      # 브라우저에서 호출하는 API 주소 (빌드 시 주입)
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

  adminer:
    image: adminer:latest
    container_name: oblige-adminer
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
